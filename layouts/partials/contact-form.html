<div class="contact-form"
     data-endpoint="{{ site.Params.contactEndpoint }}"
     data-email="{{ site.Params.email }}"
     data-lead="{{ i18n "contact_lead" }}"
     data-suggestions="{{ i18n "contact_suggestions" }}">
  <h2>{{ i18n "contact_heading" }}</h2>
  <p class="cf-help">{{ i18n "contact_help" }}</p>
  <div class="cf-card">
    <label class="sr-only" for="cf-msg">{{ i18n "contact_heading" }}</label>
    <textarea class="cf-vision" id="cf-msg" rows="4" spellcheck="false"></textarea>
    <div class="cf-chips"></div>
    <div class="cf-row">
      <input type="text" id="cf-name" placeholder="{{ i18n "contact_name" }}" autocomplete="name">
      <input type="email" id="cf-email" placeholder="{{ i18n "contact_email" }}" autocomplete="email">
    </div>
    <button type="button" class="btn btn-primary cf-send">{{ i18n "contact_send" }}</button>
    <p class="cf-status" role="status" aria-live="polite"
       data-sent="{{ i18n "contact_sent" }}"
       data-error="{{ i18n "contact_error" }}"
       data-need="{{ i18n "contact_need_msg" }}"></p>
  </div>
  <p class="eyebrow cf-contact-ey">{{ i18n "contact" }}</p>
  <p class="cf-details">
    {{ i18n "contact_prefer" }}
    <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    <span class="cf-dot" aria-hidden="true">·</span>
    <span class="cf-addr">{{ site.Params.address }}</span>
  </p>
</div>
